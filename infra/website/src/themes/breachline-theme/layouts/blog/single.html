{{ define "main" }}
<article class="post">
    <h1>{{ .Title }}</h1>
    <time class="post-meta" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    {{ .Content }}
    <p class="post-back"><a href="/blog/">&larr; Back to blog</a></p>
</article>
<script src="{{ "js/post-lightbox.js" | relURL }}" defer></script>
{{ end }}
